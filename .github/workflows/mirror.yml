name: Mirror GitHub repos to Gitee

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "只镜像这一个 owner/name，留空则遍历全部仓库"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mirror-to-gitee
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror to Gitee
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GIT_TERMINAL_PROMPT: "0"
      GITEE_API: https://gitee.com/api/v5

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check required secrets and variables
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_NAMESPACE: ${{ vars.GITEE_NAMESPACE }}
        run: |
          [ -n "$GH_PAT" ] || { echo "secret GH_PAT is not set" >&2; exit 1; }
          [ -n "$GITEE_TOKEN" ] || { echo "secret GITEE_TOKEN is not set" >&2; exit 1; }
          [ -n "$GITEE_NAMESPACE" ] || { echo "variable GITEE_NAMESPACE is not set" >&2; exit 1; }

      - name: Install git credentials
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: ${{ vars.GITEE_NAMESPACE }}
        run: |
          echo "::add-mask::$GH_PAT"
          echo "::add-mask::$GITEE_TOKEN"
          umask 077
          git config --global credential.helper store
          printf '%s\n%s\n' \
            "https://x-access-token:${GH_PAT}@github.com" \
            "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com" > ~/.git-credentials

      - name: Build target list
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO_FILTER: ${{ github.event.inputs.repo }}
        run: |
          if [ -n "$REPO_FILTER" ]; then
            echo "$REPO_FILTER" > targets.txt
          else
            gh api "/user/repos" --paginate \
              --jq '.[] | select(.fork == false and .archived == false) | .full_name' \
              > targets.txt
          fi
          echo "Targets:"
          sed 's/^/  /' targets.txt

      - name: Mirror each repo
        env:
          GITEE_NAMESPACE: ${{ vars.GITEE_NAMESPACE }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          refs_only() {
            awk -F'\t' 'index($2, "^") == 0 && ($2 ~ /^refs\/heads\// || $2 ~ /^refs\/tags\//) {print $1, $2}'
          }
          missing=0
          failed=0
          pushed=0
          skipped=0
          excluded=0
          created=0
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            name="${repo##*/}"
            if [ -f gitee-skip.txt ] && grep -qxF -e "$name" gitee-skip.txt; then
              echo "${repo}: excluded by gitee-skip.txt"
              excluded=$((excluded + 1))
              continue
            fi
            gpath=""
            [ -f gitee-map.txt ] && gpath="$(awk -F= -v k="$name" '$1==k {print $2; exit}' gitee-map.txt)"
            [ -n "$gpath" ] || gpath="$name"
            target="https://gitee.com/${GITEE_NAMESPACE}/${gpath}.git"
            if ! gh_refs_raw="$(git ls-remote "https://github.com/${repo}.git" 2>&1)"; then
              echo "::error title=GitHub unreachable::${repo} - $(printf '%s' "$gh_refs_raw" | tr -d '\r\n' | head -c 200)"
              failed=$((failed + 1))
              continue
            fi
            gh_refs="$(printf '%s\n' "$gh_refs_raw" | refs_only)"
            if gitee_refs_raw="$(git ls-remote "$target" 2>&1)"; then
              gitee_refs="$(printf '%s\n' "$gitee_refs_raw" | refs_only)"
            else
              gitee_refs=""
              if [ "$(gh api "/repos/${repo}" --jq .private 2>/dev/null)" != "false" ]; then
                echo "::notice title=Gitee repo missing::${gpath} - source is private, create it on Gitee manually"
                missing=$((missing + 1))
                continue
              fi
              echo "=== creating gitee/${GITEE_NAMESPACE}/${gpath}"
              resp="$(curl -sS -X POST "${GITEE_API}/user/repos" \
                --data-urlencode "access_token=${GITEE_TOKEN}" \
                --data-urlencode "name=${gpath}" \
                --data-urlencode "private=0" \
                --data-urlencode "description=Mirror of https://github.com/${repo}")"
              html_url="$(printf '%s' "$resp" | jq -r '.html_url // empty' | sed 's/\.git$//')"
              resp_private="$(printf '%s' "$resp" | jq -r '.private')"
              if [ "$html_url" != "https://gitee.com/${GITEE_NAMESPACE}/${gpath}" ] ||
                 [ "$resp_private" != "false" ]; then
                echo "::error title=Refusing to push::${gpath} resolved as '${html_url}' private='${resp_private}' | $(printf '%s' "$resp" | tr -d '\r\n' | head -c 200)"
                failed=$((failed + 1))
                continue
              fi
              created=$((created + 1))
            fi
            if [ "$gh_refs" = "$gitee_refs" ]; then
              echo "${repo}: up to date ($(printf '%s\n' "$gh_refs" | wc -l) refs)"
              skipped=$((skipped + 1))
              continue
            fi
            echo "=== ${repo} -> ${target}"
            rm -rf mirror.git
            if git clone --bare -q "https://github.com/${repo}.git" mirror.git &&
               git -C mirror.git push --mirror -q "$target"; then
              echo "    ok"
              pushed=$((pushed + 1))
            else
              echo "::error title=Mirror failed::${repo}"
              failed=$((failed + 1))
            fi
          done < targets.txt
          echo "pushed=${pushed} created=${created} skipped=${skipped} excluded=${excluded} missing=${missing} failed=${failed}"
          [ "$failed" -eq 0 ]
