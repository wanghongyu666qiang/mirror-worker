name: Mirror GitHub repos to Gitee

on:
  schedule:
    - cron: "0 */6 * * *"  # every 6 hours
  workflow_dispatch:
    inputs:
      repo:
        description: "只镜像这一个 owner/name，留空则遍历全部仓库"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: mirror-to-gitee
  cancel-in-progress: false

jobs:
  mirror:
    name: Mirror to Gitee
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GIT_TERMINAL_PROMPT: "0"

    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check required secrets and variables
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_NAMESPACE: ${{ vars.GITEE_NAMESPACE }}
        run: |
          [ -n "$GH_PAT" ] || { echo "secret GH_PAT is not set" >&2; exit 1; }
          [ -n "$GITEE_TOKEN" ] || { echo "secret GITEE_TOKEN is not set" >&2; exit 1; }
          [ -n "$GITEE_NAMESPACE" ] || { echo "variable GITEE_NAMESPACE is not set" >&2; exit 1; }

      - name: Install git credentials
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_USER: ${{ vars.GITEE_NAMESPACE }}
        run: |
          echo "::add-mask::$GH_PAT"
          echo "::add-mask::$GITEE_TOKEN"
          umask 077
          git config --global credential.helper store
          printf '%s\n%s\n' \
            "https://x-access-token:${GH_PAT}@github.com" \
            "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com" > ~/.git-credentials

      - name: Build target list
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO_FILTER: ${{ github.event.inputs.repo }}
        run: |
          if [ -n "$REPO_FILTER" ]; then
            echo "$REPO_FILTER" > targets.txt
          else
            gh api "/user/repos" --paginate \
              --jq '.[] | select(.fork == false and .archived == false and .private == false) | .full_name' \
              > targets.txt
          fi
          echo "Targets:"
          sed 's/^/  /' targets.txt

      - name: Mirror each repo
        env:
          GITEE_NAMESPACE: ${{ vars.GITEE_NAMESPACE }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          refs_only() {
            awk -F'\t' 'index($2, "^") == 0 && ($2 ~ /^refs\/heads\// || $2 ~ /^refs\/tags\//) {print $1, $2}'
          }
          gitee_api="https://gitee.com/api/v5"
          # 实测 2026-10-31: Gitee 建库一律建成私有(private 参数被忽略), 且无 API 可转公开
          # (PUT /repos/{o}/{r} 回 405, PATCH 回 404), 转公开只能在网页端手动做。
          gitee_create() {
            # $1 = Gitee 上的仓库名, $2 = 源仓库 (GitHub owner/name)
            local gpath="$1" src="$2" url code body msg
            if curl -fsS -o /dev/null --max-time 15 "${gitee_api}/orgs/${GITEE_NAMESPACE}?access_token=${GITEE_TOKEN}"; then
              url="${gitee_api}/orgs/${GITEE_NAMESPACE}/repos"
            elif curl -fsS -o /dev/null --max-time 15 "${gitee_api}/users/${GITEE_NAMESPACE}?access_token=${GITEE_TOKEN}"; then
              url="${gitee_api}/user/repos"
            else
              echo "create ${gpath}: namespace ${GITEE_NAMESPACE} not found on Gitee"
              return 1
            fi
            body="$(mktemp)"
            code="$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 -X POST "$url" \
              --data-urlencode "access_token=${GITEE_TOKEN}" \
              --data-urlencode "name=${gpath}" \
              --data-urlencode "private=false" \
              --data-urlencode "auto_init=false" \
              --data-urlencode "description=Mirror of https://github.com/${src}")" || code="000"
            msg="$(head -c 400 "$body" | tr -d '\r\n')"
            rm -f "$body"
            echo "create ${gpath}: HTTP ${code} ${msg}"
            [ "$code" = "201" ] || [ "$code" = "200" ]
          }
          gitee_repo_flag() {
            # $1 = Gitee 仓库名, $2 = 要看的 JSON 字段 (如 private) → 输出字段值, 查询失败输出空
            local gpath="$1" flag="$2" body
            body="$(curl -fsS --max-time 20 "${gitee_api}/repos/${GITEE_NAMESPACE}/${gpath}?access_token=${GITEE_TOKEN}" 2>/dev/null)" || return 1
            printf '%s' "$body" | grep -o "\"${flag}\":[a-z0-9\"]*" | head -1 | cut -d: -f2 | tr -d '"'
          }
          missing=0
          created=0
          private_created=0
          failed=0
          pushed=0
          skipped=0
          excluded=0
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            name="${repo##*/}"
            if [ -f gitee-skip.txt ] && grep -qxF -e "$name" gitee-skip.txt; then
              echo "${repo}: excluded by gitee-skip.txt"
              excluded=$((excluded + 1))
              continue
            fi
            gpath=""
            [ -f gitee-map.txt ] && gpath="$(awk -F= -v k="$name" '$1==k {print $2; exit}' gitee-map.txt)"
            [ -n "$gpath" ] || gpath="$name"
            target="https://gitee.com/${GITEE_NAMESPACE}/${gpath}.git"
            if ! gh_refs_raw="$(git ls-remote "https://github.com/${repo}.git" 2>&1)"; then
              echo "::error title=GitHub unreachable::${repo} - $(printf '%s' "$gh_refs_raw" | tr -d '\r\n' | head -c 200)"
              failed=$((failed + 1))
              continue
            fi
            gh_refs="$(printf '%s\n' "$gh_refs_raw" | refs_only)"
            if gitee_refs_raw="$(git ls-remote "$target" 2>&1)"; then
              gitee_refs="$(printf '%s\n' "$gitee_refs_raw" | refs_only)"
            else
              echo "::notice title=Gitee repo missing, auto-creating::${gpath}"
              gitee_create "$gpath" "$repo" || true
              sleep 2
              if gitee_refs_raw="$(git ls-remote "$target" 2>&1)"; then
                gitee_refs="$(printf '%s\n' "$gitee_refs_raw" | refs_only)"
                created=$((created + 1))
                if [ "$(gitee_repo_flag "$gpath" private)" = "true" ]; then
                  echo "::warning title=Created private on Gitee::${gpath} - Gitee 建库 API 只能建成私有, 请到 Gitee 网页端 管理→基本信息 手动转为公开(一次性)"
                  private_created=$((private_created + 1))
                fi
              else
                echo "::error title=Gitee repo unavailable::${gpath} - auto-create failed (GITEE_TOKEN needs projects scope) or repo name is invalid on Gitee; create it manually as a public repo"
                missing=$((missing + 1))
                continue
              fi
            fi
            if [ "$gh_refs" = "$gitee_refs" ]; then
              echo "${repo}: up to date ($(printf '%s\n' "$gh_refs" | wc -l) refs)"
              skipped=$((skipped + 1))
              continue
            fi
            echo "=== ${repo} -> ${target}"
            rm -rf mirror.git
            if git clone --bare -q "https://github.com/${repo}.git" mirror.git &&
               git -C mirror.git push --mirror -q "$target"; then
              echo "    ok"
              pushed=$((pushed + 1))
            else
              echo "::error title=Mirror failed::${repo}"
              failed=$((failed + 1))
            fi
          done < targets.txt
          echo "pushed=${pushed} created=${created} private_created=${private_created} skipped=${skipped} excluded=${excluded} missing=${missing} failed=${failed}"
          [ "$failed" -eq 0 ]
